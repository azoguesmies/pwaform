<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Formulario</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="header-left">
                <div class="header-icon">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div>
                    <h1>Formulario PWA</h1>
                    <p class="header-subtitle">Registro de datos con captura de ubicación y fotografía</p>
                </div>
            </div>
            <div class="header-right">
                <button class="btn-refresh" id="refreshBtn" title="Buscar actualizaciones">
                    <i class="fas fa-rotate"></i>
                </button>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-label" id="statusLabel">OFFLINE</span>
                </div>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="container">
            <section id="form-section" class="card">
                <div class="card-header">
                    <i class="fas fa-plus-circle"></i>
                    <h2>Nuevo Registro</h2>
                </div>
                <form id="pwaForm" autocomplete="off">
                    <div class="form-grid">
                        <div class="field">
                            <label for="name">
                                <i class="fas fa-user"></i> Nombres <span class="required">*</span>
                            </label>
                            <input type="text" id="name" name="name" placeholder="Ingrese sus nombres completos" autocomplete="name" required>
                            <span class="field-message"></span>
                        </div>
                        <div class="field">
                            <label for="address">
                                <i class="fas fa-map-marker-alt"></i> Dirección <span class="required">*</span>
                            </label>
                            <input type="text" id="address" name="address" placeholder="Ingrese su dirección" autocomplete="street-address" required>
                            <span class="field-message"></span>
                        </div>
                        <div class="field">
                            <label for="email">
                                <i class="fas fa-envelope"></i> EMAIL <span class="required">*</span>
                            </label>
                            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email" required>
                            <span class="field-message"></span>
                        </div>
                        <div class="field-group">
                            <div class="field half">
                                <label for="lat">
                                    <i class="fas fa-globe-americas"></i> Este (UTM)
                                </label>
                                <input type="text" id="lat" name="lat" placeholder="--" readonly>
                            </div>
                            <div class="field half">
                                <label for="lon">
                                    <i class="fas fa-globe-americas"></i> Norte (UTM)
                                </label>
                                <input type="text" id="lon" name="lon" placeholder="--" readonly>
                            </div>
                            <div class="field full" style="display:flex;gap:10px;align-items:center;">
                                <input type="text" id="utmZone" placeholder="Zona" readonly style="width:100px;padding:10px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--gray-100);color:var(--gray-600);text-align:center;">
                                <button type="button" id="getLocation" class="btn btn-secondary" style="flex:1;">
                                    <i class="fas fa-location-dot"></i> Obtener GPS
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="photo-section">
                        <label class="photo-label">
                            <i class="fas fa-camera"></i> Fotografía
                        </label>
                        <div class="photo-preview" id="photoPreviewContainer">
                            <img id="photoPreview" src="#" alt="Vista previa de foto">
                            <div class="photo-placeholder" id="photoPlaceholder">
                                <i class="fas fa-camera-retro"></i>
                                <p>Sin foto</p>
                            </div>
                        </div>
                        <div class="photo-actions">
                            <button type="button" id="capturePhoto" class="btn btn-secondary">
                                <i class="fas fa-camera"></i> Tomar Foto
                            </button>
                            <button type="button" id="uploadPhoto" class="btn btn-secondary">
                                <i class="fas fa-folder-open"></i> Cargar Foto
                            </button>
                            <button type="button" id="removePhoto" class="btn btn-outline-danger">
                                <i class="fas fa-trash-alt"></i> Eliminar Foto
                            </button>
                        </div>
                        <input type="file" id="photoInput" accept="image/*">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="saveBtn" class="btn btn-primary">
                            <i class="fas fa-save"></i> <span>Guardar</span>
                        </button>
                        <button type="button" id="clearBtn" class="btn btn-outline-secondary">
                            <i class="fas fa-eraser"></i> Limpiar
                        </button>
                    </div>
                </form>
            </section>

            <section id="records-section" class="card">
                <div class="card-header">
                    <i class="fas fa-database"></i>
                    <h2>Registros Guardados</h2>
                    <span class="badge" id="recordsCount">0</span>
                </div>
                <div id="recordsList">
                    <div class="empty-state" id="emptyState">
                        <i class="fas fa-inbox"></i>
                        <h3>No hay registros</h3>
                        <p>Complete el formulario y guarde un nuevo registro para verlo aquí.</p>
                    </div>
                </div>
                <div id="syncAllContainer" style="display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--gray-200);">
                    <button class="btn btn-primary" id="syncAllBtn" style="width:100%;">
                        <i class="fas fa-cloud-upload-alt"></i> Enviar Todos a Google Sheets
                    </button>
                    <p style="font-size:12px;color:var(--gray-400);margin-top:8px;text-align:center;" id="syncAllStatus"></p>
                </div>
            </section>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Overlay de cámara fullscreen -->
    <div id="cameraOverlay" class="camera-overlay">
        <video id="fullscreenPreview" autoplay playsinline></video>
        <div class="camera-overlay-actions">
            <button type="button" id="fullscreenCapture" class="btn btn-capture">
                <i class="fas fa-circle"></i>
            </button>
            <button type="button" id="fullscreenClose" class="btn btn-close-overlay">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
